appId: com.karas.voiceassistant
productName: VoiceAssistant
directories:
  output: dist
files:
  - "src/**/*"
  - "config.json"
  - "package.json"
  - "node_modules/**/*"
mac:
  target:
    - target: dir
    - target: zip
  category: public.app-category.productivity
  hardenedRuntime: false
  gatekeeperAssess: false
win:
  target:
    - target: portable
portable:
  splashImage: null
